<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Usuários</title>

    <link
            rel="stylesheet"
            href="../../../../../style.css"
    >

</head>

<body>

<main class="container">

    <h1>Sistema de Usuários</h1>


    <!-- ========================================== -->
    <!-- LOGIN -->
    <!-- ========================================== -->

    <section class="card">

        <h2>Login</h2>

        <form id="formLogin">

            <label for="loginEmail">
                E-mail
            </label>

            <input
                    type="email"
                    id="loginEmail"
                    placeholder="Digite seu e-mail"
                    required
            >

            <label for="loginSenha">
                Senha
            </label>

            <input
                    type="password"
                    id="loginSenha"
                    placeholder="Digite sua senha"
                    required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="mensagemLogin"></p>

    </section>


    <!-- ========================================== -->
    <!-- CADASTRO -->
    <!-- ========================================== -->

    <section class="card">

        <h2>Cadastrar usuário</h2>

        <form id="formUsuario">

            <label for="nome">
                Nome
            </label>

            <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome"
                    required
            >

            <label for="email">
                E-mail
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Digite o e-mail"
                    required
            >

            <label for="senha">
                Senha
            </label>

            <input
                    type="password"
                    id="senha"
                    placeholder="Digite a senha"
                    required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p id="mensagem"></p>

    </section>


    <!-- ========================================== -->
    <!-- LISTAGEM -->
    <!-- ========================================== -->

    <section class="card">

        <div class="titulo">

            <h2>
                Usuários cadastrados
            </h2>

            <button id="btnAtualizar">
                Atualizar
            </button>

        </div>

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Nome</th>

                <th>E-mail</th>

                <th>Data de criação</th>

                <th>Ação</th>

            </tr>

            </thead>

            <tbody id="tabelaUsuarios">

            </tbody>

        </table>

    </section>


    <!-- ========================================== -->
    <!-- BUSCAR USUÁRIO -->
    <!-- ========================================== -->

    <section class="card">

        <h2>
            Buscar usuário
        </h2>

        <div class="busca">

            <input
                    type="number"
                    id="idBusca"
                    placeholder="Digite o ID"
            >

            <button id="btnBuscar">
                Buscar
            </button>

        </div>

        <div id="resultadoBusca"></div>

    </section>


    <!-- ========================================== -->
    <!-- EDITAR USUÁRIO -->
    <!-- ========================================== -->

    <section
            class="card"
            id="secaoEdicao"
            style="display: none;"
    >

        <h2>
            Editar usuário
        </h2>

        <form id="formEdicao">

            <!-- ID do usuário -->
            <input
                    type="hidden"
                    id="idEdicao"
            >

            <label for="nomeEdicao">
                Nome
            </label>

            <input
                    type="text"
                    id="nomeEdicao"
                    placeholder="Digite o nome"
                    required
            >

            <label for="emailEdicao">
                E-mail
            </label>

            <input
                    type="email"
                    id="emailEdicao"
                    placeholder="Digite o e-mail"
                    required
            >

            <label for="senhaEdicao">
                Senha
            </label>

            <input
                    type="password"
                    id="senhaEdicao"
                    placeholder="Digite a nova senha"
                    required
            >

            <div class="acoes">

                <button type="submit">
                    Salvar alterações
                </button>

                <button
                        type="button"
                        id="btnCancelarEdicao"
                >
                    Cancelar
                </button>

            </div>

        </form>

        <p id="mensagemEdicao"></p>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
